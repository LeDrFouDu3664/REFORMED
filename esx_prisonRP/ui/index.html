<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Prison UI</title>
</head>
<body>
    <div id="notification-container"></div>

    <!-- Panneau de Personnalisation des Couleurs (Affiché uniquement en édition HUD) -->
    <div id="hud-color-picker" style="display: none;">
        <h3>Personnalisation du HUD</h3>
        <label>Texte Principal : <input type="color" id="color-primary" value="#ffffff"></label><br>
        <label>Ombres : <input type="color" id="color-shadow" value="#000000"></label><br>
        <label>Fond des Barres : <input type="color" id="color-bg" value="#000000"></label><br>
        <button id="btn-reset-colors" style="margin-top: 10px; width: 100%; padding: 5px;">Réinitialiser par défaut</button>
    </div>

    <!-- Player Card (Infos & Argent combinés, ultra esthétique, effet verre) -->
    <div class="hud-widget glass-panel" id="widget-player" style="top: 2vh; right: 2vw;">
        <div class="hud-drag-handle"><i class="fas fa-arrows-alt"></i> Joueur</div>
        <div class="hud-content player-card">
            <div class="info-row">
                <div class="info-item"><i class="fas fa-id-badge"></i> <span id="hud-id">0</span></div>
                <div class="info-item"><i class="fas fa-clock"></i> <span id="hud-time">00:00</span></div>
            </div>
            <div class="divider"></div>
            <div class="economy-row">
                <div class="eco-item cash"><i class="fas fa-wallet"></i> <span id="hud-money">0</span>$</div>
                <div class="eco-item bank"><i class="fas fa-university"></i> <span id="hud-bank">0</span>$</div>
                <div class="eco-item black"><i class="fas fa-skull-crossbones"></i> <span id="hud-black">0</span>$</div>
            </div>
        </div>
    </div>

    <!-- Statuts Vitaux (Hexagones / Diamants dynamiques en bas à droite) -->
    <div class="hud-widget" id="widget-status" style="bottom: 2vh; right: 2vw;">
        <div class="hud-drag-handle"><i class="fas fa-arrows-alt"></i> Santé & Survie</div>
        <div class="hud-content status-cluster">

            <div class="status-hex health-hex">
                <svg viewBox="0 0 100 100">
                    <path class="bg-hex" d="M50 5 L95 25 L95 75 L50 95 L5 75 L5 25 Z"></path>
                    <path class="fg-hex" id="poly-health" d="M50 5 L95 25 L95 75 L50 95 L5 75 L5 25 Z" stroke-dasharray="280" stroke-dashoffset="0"></path>
                </svg>
                <i class="fas fa-heart"></i>
            </div>

            <div class="status-hex armor-hex">
                <svg viewBox="0 0 100 100">
                    <path class="bg-hex" d="M50 5 L95 25 L95 75 L50 95 L5 75 L5 25 Z"></path>
                    <path class="fg-hex" id="poly-armor" d="M50 5 L95 25 L95 75 L50 95 L5 75 L5 25 Z" stroke-dasharray="280" stroke-dashoffset="0"></path>
                </svg>
                <i class="fas fa-shield-alt"></i>
            </div>

            <div class="status-hex hunger-hex">
                <svg viewBox="0 0 100 100">
                    <path class="bg-hex" d="M50 5 L95 25 L95 75 L50 95 L5 75 L5 25 Z"></path>
                    <path class="fg-hex" id="poly-hunger" d="M50 5 L95 25 L95 75 L50 95 L5 75 L5 25 Z" stroke-dasharray="280" stroke-dashoffset="0"></path>
                </svg>
                <i class="fas fa-hamburger"></i>
            </div>

            <div class="status-hex thirst-hex">
                <svg viewBox="0 0 100 100">
                    <path class="bg-hex" d="M50 5 L95 25 L95 75 L50 95 L5 75 L5 25 Z"></path>
                    <path class="fg-hex" id="poly-thirst" d="M50 5 L95 25 L95 75 L50 95 L5 75 L5 25 Z" stroke-dasharray="280" stroke-dashoffset="0"></path>
                </svg>
                <i class="fas fa-tint"></i>
            </div>

        </div>
    </div>

    <!-- DashBoard Véhicule (Cyberpunk / Digital) -->
    <div class="hud-widget glass-panel" id="hud-vehicle" style="bottom: 5vh; left: 18vw; display: none;">
        <div class="hud-drag-handle"><i class="fas fa-arrows-alt"></i> Véhicule</div>
        <div class="hud-content dash-container">

            <div class="dash-speedometer">
                <div class="speed-value" id="hud-speed">0</div>
                <div class="speed-metrics">
                    <span class="unit">KM/H</span>
                    <span class="gear" id="hud-gear">1</span>
                </div>
            </div>

            <div class="dash-indicators">
                <i id="indicator-left" class="fas fa-caret-left"></i>
                <div class="dash-fuel">
                    <i class="fas fa-gas-pump" id="hud-fuel-icon"></i>
                    <div class="fuel-bar-bg"><div class="fuel-bar-fg" id="hud-fuel-bar"></div></div>
                </div>
                <i id="indicator-right" class="fas fa-caret-right"></i>
            </div>

            <div class="dash-toggles">
                <div class="toggle-icon" id="hud-seatbelt"><i class="fas fa-user-slash"></i></div>
                <div class="toggle-icon" id="hud-cruise"><i class="fas fa-tachometer-alt"></i></div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
