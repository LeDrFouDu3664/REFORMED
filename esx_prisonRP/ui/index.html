<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Prison UI</title>
</head>
<body>
    <div id="notification-container"></div>

    <!-- Éléments 100% Séparés (Transparents, personnalisables) -->
    <div class="hud-widget" id="widget-id" style="top: 2vh; right: 2vw;">
        <div class="hud-drag-handle"><i class="fas fa-arrows-alt"></i> ID</div>
        <div class="hud-content" id="hud-id"><i class="fas fa-id-badge"></i> 0</div>
    </div>

    <div class="hud-widget" id="widget-time" style="top: 5vh; right: 2vw;">
        <div class="hud-drag-handle"><i class="fas fa-arrows-alt"></i> Heure</div>
        <div class="hud-content" id="hud-time"><i class="fas fa-clock"></i> 00:00</div>
    </div>

    <div class="hud-widget" id="widget-date" style="top: 8vh; right: 2vw;">
        <div class="hud-drag-handle"><i class="fas fa-arrows-alt"></i> Date</div>
        <div class="hud-content" id="hud-date"><i class="fas fa-calendar-alt"></i> 01/01/2000</div>
    </div>

    <div class="hud-widget" id="widget-money" style="top: 12vh; right: 2vw;">
        <div class="hud-drag-handle"><i class="fas fa-arrows-alt"></i> Cash</div>
        <div class="hud-content money-box"><i class="fas fa-wallet" style="color:lightgreen;"></i> <span id="hud-money">0$</span></div>
    </div>

    <div class="hud-widget" id="widget-bank" style="top: 15vh; right: 2vw;">
        <div class="hud-drag-handle"><i class="fas fa-arrows-alt"></i> Banque</div>
        <div class="hud-content money-box"><i class="fas fa-university" style="color:lightblue;"></i> <span id="hud-bank">0$</span></div>
    </div>

    <div class="hud-widget" id="widget-black" style="top: 18vh; right: 2vw;">
        <div class="hud-drag-handle"><i class="fas fa-arrows-alt"></i> Sale</div>
        <div class="hud-content money-box"><i class="fas fa-skull-crossbones" style="color:red;"></i> <span id="hud-black">0$</span></div>
    </div>

    <div class="hud-widget" id="widget-health" style="bottom: 2vh; right: 11vw;">
        <div class="hud-drag-handle"><i class="fas fa-arrows-alt"></i> Cœur</div>
        <div class="hud-content status-icon-container" style="color: #27ae60;"><i class="fas fa-heart"></i><div class="status-ring" id="ring-health"></div></div>
    </div>

    <div class="hud-widget" id="widget-armor" style="bottom: 2vh; right: 8vw;">
        <div class="hud-drag-handle"><i class="fas fa-arrows-alt"></i> Bouclier</div>
        <div class="hud-content status-icon-container" style="color: #2980b9;"><i class="fas fa-shield-alt"></i><div class="status-ring" id="ring-armor"></div></div>
    </div>

    <div class="hud-widget" id="widget-hunger" style="bottom: 2vh; right: 5vw;">
        <div class="hud-drag-handle"><i class="fas fa-arrows-alt"></i> Faim</div>
        <div class="hud-content status-icon-container" style="color: #e67e22;"><i class="fas fa-hamburger"></i><div class="status-ring" id="ring-hunger"></div></div>
    </div>

    <div class="hud-widget" id="widget-thirst" style="bottom: 2vh; right: 2vw;">
        <div class="hud-drag-handle"><i class="fas fa-arrows-alt"></i> Soif</div>
        <div class="hud-content status-icon-container" style="color: #3498db;"><i class="fas fa-tint"></i><div class="status-ring" id="ring-thirst"></div></div>
    </div>

    <!-- Conteneur Véhicule -->
    <div class="hud-widget" id="hud-vehicle" style="bottom: 2vh; left: 15vw; display: none;">
        <div class="hud-drag-handle"><i class="fas fa-arrows-alt"></i> Véhicule</div>
        <div class="hud-content hud-vehicle-flex">
            <div class="speed-row">
                <span id="hud-speed">0</span><span class="unit">KM/H</span>
            </div>
            <div class="vehicle-indicators">
                <i id="indicator-left" class="fas fa-arrow-left"></i>
                <div class="gear-box"><i class="fas fa-cog"></i> <span id="hud-gear">N</span></div>
                <i id="indicator-right" class="fas fa-arrow-right"></i>
            </div>
            <div class="vehicle-status">
                <i id="hud-fuel" class="fas fa-gas-pump" style="color: #e74c3c;"></i>
                <i id="hud-seatbelt" class="fas fa-user-slash" style="color: #e74c3c;"></i>
                <i id="hud-cruise" class="fas fa-tachometer-alt" style="color: #95a5a6;"></i>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
